<!doctype html><meta charset="utf-8"><title>probe</title><body>probe
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.all.min.js"></script>
<script>
async function buf(u){return new Float32Array(await (await fetch(u)).arrayBuffer());}
function knn(q,nq,bank,nb,d){ // 패치별 최근접 제곱거리(순수 JS)
  const out=new Float32Array(nq); const bn=new Float32Array(nb);
  for(let j=0;j<nb;j++){let s=0;for(let k=0;k<d;k++){const v=bank[j*d+k];s+=v*v;}bn[j]=s;}
  for(let i=0;i<nq;i++){let best=Infinity;const qo=i*d;let qn=0;for(let k=0;k<d;k++)qn+=q[qo+k]*q[qo+k];
    for(let j=0;j<nb;j++){let dot=0;const bo=j*d;for(let k=0;k<d;k++)dot+=q[qo+k]*bank[bo+k];const dd=qn+bn[j]-2*dot;if(dd<best)best=dd;}
    out[i]=best;}
  return out;}
window.run=async function(name,ep,reps=20){
  const r={name,ep};
  try{
    const x=await buf(name+'/input.f32'), ref=await buf(name+'/output.f32');
    let t=performance.now();
    const s=await ort.InferenceSession.create(name+'/teach_'+name+'.onnx',{executionProviders:[ep]});
    r.load_ms=performance.now()-t;
    const feed={image:new ort.Tensor('float32',x,[1,3,256,256])};
    let y=(await s.run(feed)).patches; r.shape=y.dims;
    let m=0;for(let i=0;i<ref.length;i++){const e=Math.abs(y.data[i]-ref[i]);if(e>m)m=e;} r.maxabs=m;
    const ts=[];for(let i=0;i<reps;i++){t=performance.now();y=(await s.run(feed)).patches;if(y.getData)await y.getData();ts.push(performance.now()-t);}
    ts.sort((a,b)=>a-b); r.infer_ms=ts[reps>>1];
    const d=y.dims[3], q=y.data;
    for(const shots of [5,40]){const nb=shots*1024;const bank=new Float32Array(nb*d);for(let i=0;i<bank.length;i++)bank[i]=q[i%q.length]+((i*2654435761%1000)/1000-0.5);
      t=performance.now();knn(q,1024,bank,nb,d);r['knn_ms_'+shots]=performance.now()-t;}
  }catch(e){r.error=String(e).slice(0,300);}
  return r;}
</script>
